[package]
name = "nothingx-desktop"
version = "1.0.0"
description = "Nothing X PC Desktop Companion App (Tauri v2)"
authors = ["NothingX RE Project"]
edition = "2021"

[lib]
name = "nothingx_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
